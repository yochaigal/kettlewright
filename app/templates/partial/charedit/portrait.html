<script>
  function clickImage(e) {
    const el = document.getElementById("img-" + e);
    if (!el) return;
    const selected = document.getElementById("selected-portrait");
    if (!selected) return;
    document.querySelectorAll(".edit-portrait-modal-thumbnail").forEach((thumbnail) => {
      thumbnail.classList.remove("highlighted");
    });
    el.classList.add("highlighted");
    selected.value = e;
    document.getElementById("portrait-file").value = "";
    document.getElementById("portrait-file-name").textContent = "";
    document.getElementById('edit-portrait-modal-custom-url').value = "";
  }

  function changeCustom(e) {
    document.getElementById("portrait-file").value = "";
    document.getElementById("portrait-file-name").textContent = "";
    document.querySelectorAll(".edit-portrait-modal-thumbnail").forEach((thumbnail) => {
      thumbnail.classList.remove("highlighted");
    });
    const selected = document.getElementById("selected-portrait");
    if (!selected) return;
    selected.value = "";
  }

  function changePortraitFile(input) {
    const file = input.files[0];
    document.getElementById("portrait-file-name").textContent = file ? file.name : "";
    if (!file) return;
    document.getElementById("selected-portrait").value = "";
    document.getElementById("edit-portrait-modal-custom-url").value = "";
    document.querySelectorAll(".edit-portrait-modal-thumbnail").forEach((thumbnail) => {
      thumbnail.classList.remove("highlighted");
    });
  }
</script>

<div class="modal is-active" id="edit-portrait-modal">
  <form class="no-space" enctype="multipart/form-data" hx-encoding="multipart/form-data">
    {{ portrait_form.hidden_tag() }}
    <input type="hidden" id="selected-portrait" name="selected-portrait"></input>
    <div class="modal-background" id="edit-portrait-modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head" style="width:100%">
        <div class="row16spaced">
          <h3 class="modal-card-title">{{_('Edit Portrait')}}</h3>
          <div title="Close" hx-get="/charedit/inplace-portrait/{{username}}/{{url_name}}/cancel"
            hx-target="#character-portrait-container">
            <i class="fa-solid fa-xmark xmark"></i>
          </div>
        </div>
      </header>
      <section class="modal-card-body">
        {% if error %}<p role="alert" class="red-text">{{error}}</p>{% endif %}
        <div class="portrait-custom-options">
          <div class="field" id="edit-portrait-modal-custom-url-container">
            <label for="edit-portrait-modal-custom-url">{{_('Custom Image URL')}}</label>
            <input class="input" type="url" placeholder="https://…"
              id="edit-portrait-modal-custom-url" name="custom-url" oninput="changeCustom()" />
          </div>
          <span class="portrait-option-separator">{{_('or')}}</span>
          <div class="field">
            <input type="file" id="portrait-file" name="portrait-file" accept="image/png,image/jpeg,image/webp,image/gif"
              hidden onchange="changePortraitFile(this)" />
            <button class="button portrait-upload-button" type="button"
              onclick="document.getElementById('portrait-file').click()">
              <i class="fa-solid fa-upload" aria-hidden="true"></i> {{_('Upload a portrait')}}
            </button>
            <span id="portrait-file-name" aria-live="polite"></span>
          </div>
        </div>
        <small>{{_('You can also choose one of the predefined portraits:')}}</small>
        <div id="edit-portrait-modal-image-select-container">
          {% for image in images %}
          <img onClick="clickImage('{{image}}')" data_url="{{image}}" id="img-{{image}}"
            class="edit-portrait-modal-thumbnail" src="{{url_for('static', filename='images/portraits/' + image)}}" />
          {% endfor %}
        </div>
      </section>
      <footer class="modal-card-foot">
        <div class="footer-button-container">
          <button class="button is-success" id="edit-portrait-modal-save"
            hx-post="/charedit/inplace-portrait/{{username}}/{{url_name}}/save"
            hx-target="#character-portrait-container">
            {{_('Save')}}
          </button>
          <button class="button" id="edit-portrait-modal-cancel"
            hx-get="/charedit/inplace-portrait/{{username}}/{{url_name}}/cancel"
            hx-target="#character-portrait-container">
            {{_('Cancel')}}
          </button>
        </div>
      </footer>
    </div>
  </form>
</div>
