<div class="inventory-header flex-row">
  {% for cnt in inventory.containers if not cnt.get('on_the_ground') %}
  {% set selected = cnt.is_selected and not ground_active|default(false) %}
  <button class="inventory-container-title subtitle pointer{% if selected %} inventory-container-title-selected{% endif %}{% if cnt.encumbered %} red-text{% endif %}"
    type="button" aria-pressed="{{ 'true' if selected else 'false' }}"
    hx-get="/party/inventory-select-container/{{ party.id }}/{{ cnt.id }}" hx-target="#inventory-container">{{ cnt.title }}</button>
  {% endfor %}
  {% if current_user.is_authenticated %}
  <button class="inventory-container-title inventory-ground-tab subtitle pointer{% if ground_active|default(false) %} inventory-container-title-selected{% endif %}"
    type="button" aria-pressed="{{ 'true' if ground_active|default(false) else 'false' }}"
    hx-get="{{ url_for('ground.view', party_id=party.id) }}" hx-target="#inventory-container">on the ground</button>
  {% endif %}
</div>
