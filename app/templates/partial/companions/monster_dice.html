{% extends 'main/dice_modal.html' %}
{% block dice_modal_body %}
<div id="monster-roll" data-url="{{url_for('party.shared_map_roll', party_id=c.party_id)}}"
     data-csrf="{{monster_csrf}}" data-id="{{c.id}}">
  <form id="monster-dice-form">
    <div class="dice-modal-options">
      <label class="dice-switch warden-roll-toggle">
        <input type="checkbox" role="switch" id="monster-public-roll" name="public_roll" value="on">
        <span class="dice-switch-track" aria-hidden="true"></span>
        {{_('Public roll')}}
      </label>
    </div>
    {{ super() }}
  </form>
</div>
{% endblock %}
