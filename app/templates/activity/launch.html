<!doctype html>
<html lang="{{ locale|replace('_', '-') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kettlewright</title>
  {# Discord shows this page first (#423). It signs in with the Embedded App SDK, then shows the
     whiteboard of the channel's party in a frame. No inline script: Discord's CSP forbids it. #}
  <style>
    :root { color-scheme: light dark; --text: #1b1b1f; --muted: #5f5f6b; --bg: #f6f2e8; --accent: #6965db; }
    @media (prefers-color-scheme: dark) { :root { --text: #ececf1; --muted: #a8a8b3; --bg: #121214; --accent: #a8a5ff; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    #activity-status { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; height: 100%; padding: 24px; text-align: center; }
    #activity-status[hidden], #activity-status button[hidden] { display: none; }
    #activity-status p { max-width: 32em; margin: 0; }
    #activity-status button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    #activity-board { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main id="activity-status" role="status" aria-live="polite">
    <p id="activity-message">{{ _('Opening the whiteboard…') }}</p>
    <button type="button" id="activity-link" hidden>{{ _('Open Kettlewright') }}</button>
  </main>
  <script id="activity-config" type="application/json">{{ {
    'clientId': client_id,
    'tokenUrl': url_for('activity.token'),
    'messages': {'failed': _('Unable to open the whiteboard. Close it and open it again.')}
  }|tojson }}</script>
  <script type="module" src="{{ url_for('activity.static', filename='src/js/activity/launch.js') }}"></script>
</body>
</html>
