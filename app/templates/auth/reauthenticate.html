{% extends 'base.html' %}{% block content %}
<div class="body-container auth-container"><form class="auth-card" method="post">
  {{form.hidden_tag()}}<h1>{{_('Confirm your password')}}</h1>
  {{form.password.label}}{{form.password(class='input', autocomplete='current-password')}}
  <button class="button" type="submit">{{_('Continue')}}</button>
  {% include 'auth/mfa_messages.html' %}
</form></div>{% endblock %}
