{% from 'campaigns/forms.html' import token, page_header with context %}
<div x-data="pointcrawl" data-graph="{{ graph|tojson|forceescape }}" data-editing="{{ 'true' if editing else 'false' }}" data-form="map-form"
 {% if player_pins is defined %}data-player-pins="{{ player_pins|tojson|forceescape }}"{% endif %}
 {% if editing %}data-geography-url="{{ url_for('campaigns.realm_geography', map_id=pointcrawl.id) }}" data-save-url="{{ url_for('campaigns.map_data', map_id=pointcrawl.id) }}"{% endif %}
 data-labels="{{ {'imageType':_('Choose a PNG, JPG or WebP image.'),'imageTooLarge':_('This image is too large for a map. Try a smaller one.'),'imageLoading':_('Preparing the image…'),'imageError':_('Unable to read this image. Try another one.'),'loadError':_('Unable to load the drawing editor. Check your connection and retry.'),'location':_('Article'),'saved':_('Drawing saved.'),'error':_('Unable to save. Check the connection, numbering and linked articles.'),'conflict':_('This drawing changed in another tab. Reload before saving.'),'duplicate':_('This article or path already exists.'),
 'pin':_('Pin'),'pick':_('Click the map where the pin goes.')}|tojson|forceescape }}">
{% if editing %}<p class="map-unsaved" :style="{visibility: dirty ? 'visible' : 'hidden'}">{{ _('Unsaved changes: Save map keeps them.') }}</p>{% endif %}
{% if editing %}<input type="hidden" form="map-form" name="graph" :disabled="!dirty" :value="JSON.stringify(graph)">{% endif %}
{% if editing %}
<form x-ref="saveForm" @submit.prevent="save()" hidden>{{ token() }}</form>
{% endif %}
<p class="campaign-status" role="status" x-text="status"></p>
<div :inert="saving">{% include 'campaigns/canvas.html' %}</div>
</div>
