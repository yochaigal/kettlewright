{% from 'campaigns/forms.html' import rich_editor with context %}
{# One pin: its note. A pin added here has its own map note; an older point shows the article it places. #}
<template x-if="selected===String(item.id)"><div class="map-pin-detail">
{% if editing %}
<div @input="selectedNode.content_changed=true">
<label>{{ _('Title') }}<input type="text" maxlength="200" x-model="selectedNode.title"></label>
{{ rich_editor(_('Note'), name=None, model='selectedNode.body') }}
</div>
<div class="campaign-actions">
<template x-if="selectedNode.entry_id && selectedNode.category!=='map_note'"><a class="kw-action" :href="'/materials/'+selectedNode.entry_id+'/edit'"><i class="fa-solid fa-file-lines" aria-hidden="true"></i> {{ _('Open article') }}</a></template>
<button type="button" class="kw-action kw-action-danger" @click="removeNode()"><i class="fa-solid fa-trash" aria-hidden="true"></i> {{ _('Remove pin') }}</button>
</div>
<p class="import-hint">{{ _('Save map keeps your changes.') }}</p>
{% else %}
<div class="rich-content" x-html="$richHTML(selectedNode.body, selectedNode.references)"></div>
{% if party %}<template x-if="selectedNode.category!=='map_note'"><a :href="'/party/{{ party.id }}/materials/'+selectedNode.entry_id">{{ _('Open article') }}</a></template>{% endif %}
{% endif %}
</div></template>
