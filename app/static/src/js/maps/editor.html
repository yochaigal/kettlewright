<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css">
  <link rel="stylesheet" href="../../css/canvas_ui.css">
  <style>html,body,#editor{margin:0;width:100%;height:100%;overflow:hidden}
  /* Party map fog (the whiteboard's layer). */
  .excalidraw canvas.whiteboard-fog{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;cursor:crosshair;filter:none!important}
  .fog-brush-cursor{display:none;position:absolute;z-index:3;pointer-events:none;border-radius:50%;border:1px solid white;box-shadow:0 0 0 1px #171923;transform:translate(-50%,-50%);box-sizing:border-box}
  /* A pin's title on hover (#494). */
  .pin-tooltip{position:fixed;z-index:10;max-width:16rem;padding:.3rem .55rem;border-radius:6px;pointer-events:none;
    font:600 14px/1.3 system-ui,sans-serif;color:#1b1b1f;background:#fff;border:1px solid #ced4da;box-shadow:0 2px 8px rgb(0 0 0/.18)}
  .pin-tooltip.is-dark{color:#e9ecef;background:#232329;border-color:#495057}
  .pin-tooltip[hidden]{display:none}
  /* An image map (#506) read by a party: the picture alone, no editor UI (zoom with the wheel or a pinch). */
  body.image-map{background:transparent}
  body.image-map-reading .excalidraw .layer-ui__wrapper,body.image-map-reading .excalidraw .disable-zen-mode,
  body.image-map-reading .excalidraw .App-bottom-bar,body.image-map-reading .excalidraw .footer-center{display:none!important}
  /* Drawing on a map: Excalidraw's tools as a rail down the left side, not a bar across the top of the map, the same
     rail as the whiteboard's (shared_map.css). Narrow frames keep Excalidraw's own layout. */
  @media (min-width:901px){
    body.drawing-editor .excalidraw .App-menu_top .shapes-section{position:absolute;top:64px;left:0}
    body.drawing-editor .excalidraw .App-toolbar-container{align-items:start;gap:8px}
    body.drawing-editor .excalidraw .App-toolbar .Stack_horizontal{grid-auto-flow:row}
    body.drawing-editor .excalidraw .App-menu_top .layer-ui__wrapper__top-right{grid-column:3}
    body.drawing-editor .excalidraw .App-toolbar__divider{width:24px;height:1px;margin:4px 0}
    body.drawing-editor .excalidraw .HintViewer{display:none}
    body.drawing-editor .excalidraw .App-toolbar__extra-tools-dropdown{top:auto;bottom:0;left:calc(100% + 8px);right:auto;margin-top:0}
    body.drawing-editor .excalidraw .App-menu__left{margin-left:64px}
    body.drawing-editor .excalidraw .layer-ui__wrapper__footer-left{margin-left:64px}  /* Zoom beside the rail, not under it. */
  }</style>
  <script>window.EXCALIDRAW_ASSET_PATH = 'https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/';</script>
  <script type="importmap">
  {"imports": {
    "preact": "https://esm.sh/preact@10.29.8",
    "preact/hooks": "https://esm.sh/preact@10.29.8/hooks?external=preact",
    "react": "https://esm.sh/preact@10.29.8/compat?external=preact",
    "react-dom": "https://esm.sh/preact@10.29.8/compat?external=preact",
    "react-dom/client": "https://esm.sh/preact@10.29.8/compat/client?external=preact",
    "react/jsx-runtime": "https://esm.sh/preact@10.29.8/jsx-runtime?external=preact",
    "excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.js?external=react,react-dom"
  }}
  </script>
</head>
<body><div id="editor"></div><script type="module" src="./editor.js"></script></body>
</html>
