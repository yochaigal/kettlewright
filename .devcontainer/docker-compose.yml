services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    env_file: ../.env
    command:
      - /bin/sh
      - -ec
      - |
        bash .devcontainer/post-create.sh
        exec flask run --debug --no-debugger --host=0.0.0.0 --port=8000
    environment:
      - FLASK_APP=app:application
      - FLASK_DEBUG=1
      - USE_FLASK=True
      - PYTHONUNBUFFERED=1
      - USE_REDIS=False
      - REQUIRE_SIGNUP_CODE=False
    depends_on:
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - kettlewright-network

  mailpit:
    image: axllent/mailpit:v1.21
    command: ["--smtp-auth-accept-any", "--smtp-auth-allow-insecure"]
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - kettlewright-network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: Uncomment if you want to use Redis for development
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - kettlewright-network

networks:
  kettlewright-network:
    driver: bridge
