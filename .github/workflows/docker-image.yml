name: Build and Deploy Docker Image

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '.env.template'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '.env.template'
      - 'README.md'
      - 'Pipfile'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: yochaigal/kettlewright:latest

      - name: Deploy Container to DigitalOcean via SSH
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            CONTAINER_NAME="kettlewright"
            IMAGE_NAME="yochaigal/kettlewright:latest"

            echo "--> Pulling latest image..."
            docker pull "$IMAGE_NAME"

            if [ "$(docker ps -aq -f name=^/${CONTAINER_NAME}$)" ]; then
                echo "--> Stopping and removing old container..."
                docker stop "$CONTAINER_NAME"
                docker rm "$CONTAINER_NAME"
            fi

            echo "--> Starting updated container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network kettlewright-net \
              --env-file ~/docker/kettlewright/.env \
              -v kettlewright_db:/app/instance \
              -p 8000:8000 \
              --restart always \
              "$IMAGE_NAME"

            echo "--> Cleaning unused images..."
            docker image prune -f
